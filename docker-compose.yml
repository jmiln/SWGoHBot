services:
  # Runs to completion before the services below, copying any data/ file that is missing from the
  # mount out of the image's pristine copy. A bind mount never inherits image content, so without
  # this a host with no checkout mounts an empty directory over /app/data and the bot dies reading
  # characters.json during module load.
  dataseed:
    image: ghcr.io/jmiln/swgohbot:${IMAGE_TAG:-latest}
    build: .
    container_name: swgoh-dataseed
    # root: a bind-mount directory Docker just created is owned by root, and the seed has to write
    # into it and then hand it to the runtime uid.
    user: root
    restart: "no"
    command: ["node", "scripts/seedData.ts"]
    env_file: .env
    environment:
      DATA_UID: "${DATA_UID:-1000}"
      DATA_GID: "${DATA_GID:-1000}"
    volumes:
      - ${DATA_DIR:-./data}:/app/data

  # Never started by `docker compose up` - `profiles:` keeps it out unless it is named explicitly.
  # It exists so the host crontab can run the updater from the image instead of from a checkout:
  #   0 4 * * * cd /srv/swgohbot && docker compose run --rm dataupdater >> <log> 2>&1
  # Still run-once-and-exit, so the OS reclaims the cycle's large transient allocations between runs.
  dataupdater:
    image: ghcr.io/jmiln/swgohbot:${IMAGE_TAG:-latest}
    build: .
    profiles: ["updater"]
    restart: "no"
    command: ["node", "services/dataUpdater.ts", "--cleanup"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - swgoh
    volumes:
      - ${DATA_DIR:-./data}:/app/data

  bot:
    image: ghcr.io/jmiln/swgohbot:${IMAGE_TAG:-latest}
    # `build:` is for local iteration only. Anything deployed is built and published by CI.
    build: .
    container_name: swgohbot
    restart: unless-stopped
    command: ["node", "swgohBotShard.ts"]
    env_file: .env
    environment:
      # tini (Docker's bundled init) signals only its direct child by default, which would reach the
      # ShardingManager but not the shards, since Shard.spawn forks them as separate processes. This
      # is tini's documented env equivalent of -g: signal the whole process group, so every shard
      # runs its own gracefulShutdown and flushes command stats, as pm2's treekill does today.
      TINI_KILL_PROCESS_GROUP: "1"
      # Loopback inside a container is that container's own, so the healthcheck and the published
      # port could not reach it. The host-side 127.0.0.1 prefix below is what keeps this off the
      # network.
      SHARD_STATUS_HOST: 0.0.0.0
    init: true
    # pm2 currently gives the shards 1600ms and most do not finish closing Mongo. 15s is generous.
    stop_grace_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - swgoh
    depends_on:
      dataseed:
        condition: service_completed_successfully
    volumes:
      - ${DATA_DIR:-./data}:/app/data:ro
    ports:
      - "127.0.0.1:${SHARD_STATUS_PORT:-3810}:${SHARD_STATUS_PORT:-3810}"
    healthcheck:
      # Fails only on total fleet loss, which is the one case restarting fixes. A single sick shard
      # shows in /status and is left to the ShardingManager's own respawn, since restarting here
      # would kill every healthy shard to fix one.
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.SHARD_STATUS_PORT||3810)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      # Past the 60s Manager.spawn timeout with room to spare. /health reports 200 while starting,
      # so this only has to outlast the spawn itself.
      start_period: 180s

  eventserve:
    image: ghcr.io/jmiln/swgohbot:${IMAGE_TAG:-latest}
    build: .
    container_name: swgoh-eventserve
    restart: unless-stopped
    command: ["node", "services/eventServe.ts"]
    env_file: .env
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${EVENT_SERVER_PORT:-3700}:${EVENT_SERVER_PORT:-3700}"
    networks:
      - swgoh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.EVENT_SERVER_PORT||3700)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s

  swapiserve:
    image: ghcr.io/jmiln/swgohbot:${IMAGE_TAG:-latest}
    build: .
    container_name: swgoh-swapiserve
    restart: unless-stopped
    command: ["node", "services/swapiServe/index.ts"]
    env_file: .env
    environment:
      # Must listen on all of this container's interfaces to be reachable from the bot container.
      # That is the container's own network namespace, not the host's: the published port below
      # stays on loopback, and the control routes are guarded by SWAPI_SERVE_CONTROL_SECRET.
      SWAPI_SERVE_HOST: "0.0.0.0"
    init: true
    # Past SHUTDOWN_GRACE_MS in services/swapiServe/index.ts, so the service finishes its own
    # shutdown rather than being killed partway through it.
    stop_grace_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SWAPI_SERVE_PORT:-3800}:${SWAPI_SERVE_PORT:-3800}"
    networks:
      - swgoh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.SWAPI_SERVE_PORT||3800)+'/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s

# Owned by the separate `fake-help` compose project, which runs comlink, nginx and swgoh-ae2.
# That project must be up first; compose will neither create nor destroy this network.
networks:
  swgoh:
    name: fake-help_default
    external: true
